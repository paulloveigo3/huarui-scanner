<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>華瑞｜年終掃碼盤點</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#183b35;background:#edf3ef;font-size:18px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:#e9efeb;color:#153b32;min-height:43px;padding:8px 12px;font-weight:700}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #e5a233;outline-offset:2px}.primary{background:#17654f;color:#fff}.warn{background:#fff0d5;color:#724700}#app{height:100vh;height:100dvh;max-width:560px;margin:auto;padding:8px 12px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}header strong{font-size:21px}small{font-size:13px;color:#526c62}.camera{height:24vh;height:24dvh;min-height:90px;max-height:190px;position:relative;flex-shrink:1;border-radius:18px;overflow:hidden;background:#152921}video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;inset:18% 12%;border:2px solid #dcf3a6;border-radius:12px;pointer-events:none}.cam-caption{position:absolute;bottom:5px;left:8px;color:white;background:#123a30bc;border-radius:8px;padding:3px 8px;font-size:13px}.bar{display:flex;gap:6px}.bar>*{flex:1;min-width:0}.bar button{font-size:15px}#sync{font-size:13px;min-height:18px}#card{flex:1;min-height:0;border-radius:18px;background:white;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto}h1{font-size:24px;line-height:1.25;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}p{margin:0;line-height:1.4}#message{font-size:16px;padding:6px 9px;background:#eff5ed;border-radius:9px;white-space:pre-line}.qty{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qty label{font-size:15px}.qty input{width:100%;height:54px;font-size:30px;font-weight:750;text-align:center;border:2px solid #d7e4db;border-radius:12px;color:#145740;background:#f8fbf7}.qty input.active{border-color:#1b7158;background:#eef8e5}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.keypad button{font-size:22px;min-height:41px;padding:4px}.utilities{display:flex;gap:5px}.utilities button{flex:1;font-size:15px;min-height:34px;padding:4px}.tags{display:flex;gap:6px;overflow:auto;min-height:37px;flex-shrink:0}.tags button{white-space:nowrap;font-size:15px;min-height:34px;padding:6px 10px}.tags button.chosen{background:#17654f;color:white}#note{width:100%;border:1px solid #c7d9ce;border-radius:9px;padding:8px;font-size:17px;min-height:40px}#save{width:100%;font-size:22px;min-height:49px;flex-shrink:0}#manual{width:100%;border:1px solid #c7d9ce;border-radius:8px;padding:7px;font-size:16px}.hidden{display:none!important}body.note-edit .keypad,body.note-edit .utilities{display:none}body.note-edit .camera{max-height:90px}@media(max-height:680px){#app{gap:5px;padding-top:5px}#card{padding:9px;gap:5px}.camera{max-height:130px}.qty input{height:45px}.keypad button{min-height:34px}h1{font-size:22px}#message{font-size:14px}#save{min-height:43px}}
</style></head><body>
<div id="app"><header><div><strong>年終掃碼盤點</strong><br><small id="date">等待盤點頁連線</small></div><button id="finish">完成／返回</button></header>
<div class="camera"><video id="video" muted autoplay playsinline></video><div class="guide"></div><span class="cam-caption" id="camera-status">點下方按鈕啟動後鏡頭</span></div>
<div class="bar"><button id="camera-on" class="primary">啟動／恢復鏡頭</button><button id="camera-off">暫停鏡頭</button><button id="retry">重試傳送</button></div>
<div id="sync" role="status" aria-live="polite">尚未連接；請從原盤點頁的掃碼按鈕開啟。</div>
<section id="card"><div class="bar"><input id="manual" aria-label="條碼或商品編號" placeholder="也可輸入條碼或商品編號"><button id="find">尋找</button></div>
<h1 id="name">鏡頭對準 QR Code 或條碼</h1><small id="info">辨識後顯示單一商品；鏡頭持續開啟。</small>
<div id="message" role="status" aria-live="polite">載入清單後，可開始盤點。</div>
<div class="bar"><button id="edit" class="warn hidden">修改／重新盤點</button><button id="skip" disabled>下一件（不儲存）</button></div>
<div class="qty"><label>當前實盤數量<input id="actual" readonly inputmode="none" aria-label="當前實盤數量"></label><label>盤缺數量<input id="shortage" readonly inputmode="none" aria-label="盤缺數量"></label></div>
<div class="keypad" id="keys"></div><div class="utilities"><button data-key=".">小數點</button><button data-key="erase">退一格</button><button data-key="clear">清除</button></div>
<div class="tags" id="tags"></div><input id="note" maxlength="200" placeholder="補充註記（選填）" aria-label="文字註記" disabled>
</section><button id="save" class="primary" disabled>已盤點・儲存並繼續掃描</button></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js" crossorigin="anonymous"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.hash.slice(1));
const channel=params.get('channel'),parentOrigin=params.get('parent');
const trustedParent=!!parentOrigin&&/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(parentOrigin)||parentOrigin==='https://script.google.com';
const sender=window.opener;
let context=null,records={},codeIndex=new Map(),current=null,draft=null,editable=false,field='actual',replaceNumber=true,queuePrefix='',controls=null,starting=false,wakeLock=null,lastCode='',lastSeen=0,flight=null,retryTimer=0,refreshAt=0,lastError='';
const opRetries=new Map();
function post(type,payload={}){if(sender&&!sender.closed&&trustedParent&&channel)sender.postMessage({type,channel,...payload},parentOrigin);}
function uid(){return crypto.randomUUID();}
function rounded(n){return Math.round(n*1000)/1000;}
function ops(){const out=[];if(!queuePrefix)return out;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(queuePrefix)){const o=JSON.parse(localStorage.getItem(k));if(o&&o.opId)out.push(o);}}return out.sort((a,b)=>a.createdAt.localeCompare(b.createdAt)||a.baseRevision-b.baseRevision||a.opId.localeCompare(b.opId));}
function matching(o){return context&&o.dataset===context.session.dataset&&o.date===context.session.date&&o.snapshotId===context.session.snapshotId;}
function currentOps(){return ops().filter(matching);}
function effective(id){const pending=currentOps().filter(o=>o.sku===id),last=pending[pending.length-1];return last?{...last,revision:last.baseRevision+1,syncState:'PHONE_PENDING'}:records[id];}
function status(){if(!context)return;let list;try{list=ops();}catch(e){$('sync').textContent='手機儲存異常，請勿繼續盤點：'+e.message;return;}const here=list.filter(matching).length,other=list.length-here;let text=here?'掃碼頁待傳 '+here+' 筆':'本頁待傳 0 筆';if(other)text+='；其他日期 '+other+' 筆（回原頁載入該日後再開掃碼）';text+=sender&&!sender.closed?'':'；原盤點分頁已關閉，請重新從原頁開啟掃碼';if(lastError)text+='；'+lastError;$('sync').textContent=text;}
function buildIndex(products){const m=new Map();for(const p of products)for(const code of new Set([p.id,...(p.codes||[])])){if(!m.has(code))m.set(code,[]);m.get(code).push(p);}return m;}
function canScan(code,now){const repeat=code===lastCode&&now-lastSeen<1600;lastCode=code;lastSeen=now;return !repeat&&!current;}
function detect(code,manual=false){if(!context)return;code=String(code);if(!manual&&!canScan(code,Date.now()))return;if(manual&&current){$('message').textContent='請先儲存或按「下一件」，再尋找其他商品。';return;}const found=codeIndex.get(code)||[];if(!found.length){$('message').textContent='找不到此條碼：'+code.slice(0,80)+'。請核對商品編號或條碼對照，不會自動新增。';return;}if(found.length>1){$('message').textContent='此條碼對應多件商品，請輸入唯一商品編號，並請管理者修正對照。';return;}select(found[0]);if(navigator.vibrate)navigator.vibrate(50);}
function select(p){current=p;const r=effective(p.id);editable=!r;draft={actual:r&&r.actual!==null?String(r.actual):'',shortage:p.book!==null&&r&&r.actual!==null?String(rounded(Math.max(0,p.book-r.actual))):'',tags:r&&r.status!=='CONFLICT'?[...(r.tags||[])]:[],note:r&&r.status!=='CONFLICT'?r.note||'':'',baseRevision:r?r.revision:0,resolveConflict:false};field='actual';replaceNumber=true;$('name').textContent=p.name;$('info').textContent=p.id+' · 帳面 '+(p.book===null?'待確認':p.book)+' · 售價 '+p.price;$('message').className=r?'warn':'';$('message').textContent=r?(r.status==='CONFLICT'?'這件有不同結果，正式數量已留空。請現場重新清點。':'這件已盤過！原實盤 '+r.actual+'，'+(r.operator||'')+'。查看後可選擇修改；不會再自動儲存。'):'輸入實盤數量後按儲存。鏡頭持續開啟，編輯時暫不切換商品。';$('edit').classList.toggle('hidden',!r);$('skip').disabled=false;paint();}
function paint(){for(const key of ['actual','shortage']){$(key).value=draft?draft[key]:'';$(key).classList.toggle('active',editable&&field===key);}$('note').value=draft?draft.note:'';$('note').disabled=!editable;$('save').disabled=!editable;$('tags').replaceChildren();for(const t of context?.tags||[]){const b=document.createElement('button');b.textContent=t;b.className=draft?.tags.includes(t)?'chosen':'';b.disabled=!editable;b.onclick=()=>{draft.tags=draft.tags.includes(t)?draft.tags.filter(x=>x!==t):[...draft.tags,t];paint();};$('tags').append(b);}}
function clearItem(){current=null;draft=null;editable=false;$('name').textContent='請掃描下一件商品';$('info').textContent='同一條碼請先移出鏡頭再重新掃描。';$('edit').classList.add('hidden');$('skip').disabled=true;paint();}
function number(key){if(!editable||!draft)return;let value=draft[field];if(key==='clear')value='';else if(key==='erase')value=value.slice(0,-1);else if(key==='.')value=replaceNumber?'0.':value.includes('.')?value:(value||'0')+'.';else value=(replaceNumber||value==='0'?'':value)+key;if(!/^\d{0,9}(?:\.\d{0,3})?$/.test(value))return;const n=Number(value);if(field==='shortage'&&(current.book===null||current.book<0||n>current.book)){$('message').textContent='帳面為負數時請直接輸入實盤；盤缺不可大於帳面。';return;}if(value===''){draft.actual='';draft.shortage='';}else if(field==='actual'){draft.actual=value;draft.shortage=current.book===null?'':String(rounded(Math.max(0,current.book-n)));}else{draft.shortage=value;draft.actual=String(rounded(current.book-n));}replaceNumber=false;paint();}
function save(){if(!editable||!current||!draft)return;if(draft.actual===''||draft.actual==='.'||!Number.isFinite(Number(draft.actual))){$('message').textContent='請輸入實盤數量，零庫存請按 0。';return;}if(draft.resolveConflict&&!confirm('確認已現場重新清點，並以這次數量解除衝突留空？'))return;const s=context.session,now=new Date().toISOString(),op={opId:uid(),dataset:s.dataset,date:s.date,mode:'annual',warehouse:s.warehouse,snapshotId:s.snapshotId,sku:current.id,name:current.name,book:current.book,actual:Number(draft.actual),tags:[...draft.tags],note:draft.note.trim(),baseRevision:draft.baseRevision,resolveConflict:draft.resolveConflict,operator:context.operator,clientId:context.clientId,status:'COUNTED',countedAt:now,createdAt:now};try{localStorage.setItem(queuePrefix+op.opId,JSON.stringify(op));}catch(e){$('message').textContent='手機保存失敗，尚未標成已盤點。請保留畫面並檢查儲存空間。';return;}clearItem();$('message').textContent='已先存手機，等待雲端確認。可繼續掃下一件。';status();pump();}
function pump(){if(!context||!navigator.onLine||flight||Date.now()<retryTimer)return;const pending=currentOps(),op=pending.find((o,i)=>(opRetries.get(o.opId)||0)<=Date.now()&&!pending.slice(0,i).some(p=>p.sku===o.sku));if(!op){status();return;}if(!sender||sender.closed){status();return;}flight={opId:op.opId,at:Date.now()};post('save',{op});status();}
window.addEventListener('message',e=>{
 if(!trustedParent||e.origin!==parentOrigin||e.source!==sender||!e.data||e.data.channel!==channel)return;
 const d=e.data;
 if(d.type==='init'&&!context){if(d.session?.mode!=='annual'||!Array.isArray(d.session.products))return;context=d;records=d.session.records||{};codeIndex=buildIndex(d.session.products);queuePrefix='hr-scan-v1:'+JSON.stringify([d.appId,d.clientId,d.operator])+':op:';$('date').textContent=d.session.date+' · '+d.operator+' · '+(d.session.dataset==='test'?'測試':'正式');$('message').textContent='已載入 '+d.session.products.length+' 件，請啟動鏡頭。';status();pump();return;}
 if(!context)return;
 if(d.type==='ack'){
  const raw=localStorage.getItem(queuePrefix+d.opId);if(!raw||!d.record)return;const op=JSON.parse(raw);if(!matching(op)||d.record.sku!==op.sku)return;
  const old=records[op.sku];if(!old||old.revision<=d.record.revision)records[op.sku]=d.record;
  localStorage.removeItem(queuePrefix+d.opId);opRetries.delete(d.opId);if(flight?.opId===d.opId)flight=null;lastError='';
  if(d.record.status==='CONFLICT'){$('message').textContent='注意：'+op.name+' 有不同結果，正式數量已留空，請重新盤點。';$('message').className='warn';}
  status();pump();return;
 }
 if(d.type==='failure'){if(flight?.opId===d.opId)flight=null;opRetries.set(d.opId,Date.now()+30000);retryTimer=0;lastError=d.message;status();return;}
 if(d.type==='state'){for(const [id,r] of Object.entries(d.records||{})){const prior=records[id];if(!prior||prior.revision<=r.revision){records[id]=r;if(current?.id===id&&r.status==='CONFLICT'&&r.revision>(prior?.revision||0)){if(draft)try{localStorage.setItem(queuePrefix.replace(':op:',':conflict-draft:')+id,JSON.stringify(draft));}catch(e){}select(current);}}}return;}
 if(d.type==='notice'){lastError=d.message;status();}
});
async function startCamera(){if(starting||controls)return;if(!context){$('message').textContent='請先從原盤點頁連接並載入年終清單。';return;}if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){$('camera-status').textContent='需使用 HTTPS 與支援相機的 Safari／Chrome';return;}if(!window.ZXingBrowser){$('camera-status').textContent='掃碼元件未載入，請連網重新開啟；仍可輸入商品編號';return;}starting=true;$('camera-status').textContent='正在啟動相機…';try{const reader=new ZXingBrowser.BrowserMultiFormatReader();controls=await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},$('video'),result=>{if(result)detect(result.getText());});$('camera-status').textContent='鏡頭常開 · QR Code／一維條碼';if(navigator.wakeLock)try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}catch(e){$('camera-status').textContent=e.name==='NotAllowedError'?'相機未獲允許，請在網站權限中開啟':'相機啟動失敗，請恢復鏡頭或手輸編號';}finally{starting=false;}}
function stopCamera(){if(controls){controls.stop();controls=null;}const stream=$('video').srcObject;if(stream)for(const track of stream.getTracks())track.stop();$('video').srcObject=null;if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}$('camera-status').textContent='鏡頭已暫停，點啟動可恢復';}
$('camera-on').onclick=async()=>{if(controls&&$('video').srcObject?.getVideoTracks().every(t=>t.readyState==='live')&&!$('video').paused)return;stopCamera();await startCamera();};$('camera-off').onclick=stopCamera;
$('save').onclick=save;$('skip').onclick=()=>{if(editable&&draft.actual!==''&&!confirm('這件尚未儲存，確定略過？'))return;clearItem();$('message').textContent='可掃描下一件；鏡頭保持開啟。';};
$('edit').onclick=()=>{const r=effective(current.id);if(currentOps().some(o=>o.sku===current.id)){$('message').textContent='這件仍待傳，請先收到雲端確認再修改，避免離線版本連鎖衝突。';return;}editable=true;draft.baseRevision=r?r.revision:0;draft.resolveConflict=r?.status==='CONFLICT';if(draft.resolveConflict){draft.actual='';draft.shortage='';draft.tags=[];draft.note='';}$('edit').classList.add('hidden');$('message').textContent=draft.resolveConflict?'請重新現場清點後輸入，不能直接選用其中一份。':'修改後按儲存，原始紀錄會保留。';paint();};
$('find').onclick=()=>detect($('manual').value.trim(),true);$('manual').onkeydown=e=>{if(e.key==='Enter')$('find').click();};
for(const k of ['1','2','3','4','5','6','7','8','9','0']){const b=document.createElement('button');b.textContent=k;b.dataset.key=k;$('keys').append(b);}document.addEventListener('click',e=>{const k=e.target.closest('[data-key]');if(k)number(k.dataset.key);});
for(const key of ['actual','shortage'])$(key).onclick=()=>{field=key;replaceNumber=true;paint();};$('note').oninput=e=>{if(draft)draft.note=e.target.value;};$('note').onfocus=()=>document.body.classList.add('note-edit');$('note').onblur=()=>document.body.classList.remove('note-edit');
$('retry').onclick=()=>{opRetries.clear();retryTimer=0;lastError='';if(flight&&Date.now()-flight.at>95000)flight=null;pump();post('state');};
$('finish').onclick=()=>{const pending=ops().length;if((pending||editable&&draft?.actual!=='')&&!confirm('尚有待傳或未儲存內容。請先儲存；已保存的待傳資料會保留在此網站，重新從原盤點頁開啟後補傳。仍要返回？'))return;stopCamera();if(sender&&!sender.closed){sender.focus();window.close();}else $('message').textContent='請回到原 Google 盤點網址重新登入，再開啟本掃碼頁補傳。';};
window.addEventListener('pagehide',stopCamera);window.addEventListener('online',()=>{retryTimer=0;pump();});window.addEventListener('beforeunload',e=>{if(context&&(ops().length||editable&&draft?.actual!=='')){e.preventDefault();e.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){retryTimer=0;pump();post('state');if(controls)$('camera-status').textContent='若畫面停住，請點「啟動／恢復鏡頭」';}});
setInterval(()=>{if(!context){post('ready');return;}if(flight&&Date.now()-flight.at>95000){flight=null;retryTimer=Date.now()+15000;lastError='等待確認，原紀錄保留並重試';}if(Date.now()-refreshAt>60000){refreshAt=Date.now();post('state');}pump();status();},5000);
if(!trustedParent||!sender||!channel){$('message').textContent='請從 Google 盤點頁「年終大盤點 → 開啟相機掃碼盤點」進入；單獨開檔不能連接資料。';}else post('ready');
</script></body></html>
